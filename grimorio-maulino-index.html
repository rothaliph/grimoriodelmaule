<!DOCTYPE html>
<html lang="en">

<head>
	<!--5ETOOLS_CMP-->
	<!--5ETOOLS_ANALYTICS-->
	<!--5ETOOLS_ADCODE-->
	<meta charset="utf-8">
	<meta name="description" content="">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="mobile-web-app-capable" content="yes">

	<title>Grimorio Maulino - Campañas - 5etools</title>

	<link rel="stylesheet" href="css/bootstrap.css">
	<link rel="stylesheet" href="css/main.css">

	<style>
		.grimoire-campaign-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
			gap: 12px;
		}

		.grimoire-campaign-card {
			display: flex;
			flex-direction: column;
			height: 100%;
			border: 1px solid #8884;
			border-radius: 6px;
			overflow: hidden;
			background: var(--rgb-bg--alt);
		}

		.grimoire-campaign-card__img {
			width: 100%;
			height: 170px;
			object-fit: cover;
			background: #0002;
		}

		.grimoire-campaign-card__body {
			display: flex;
			flex-direction: column;
			padding: 12px;
			gap: 8px;
		}

		.grimoire-campaign-card__body h3 {
			white-space: normal;
			overflow-wrap: anywhere;
			word-break: break-word;
		}

		.grimoire-campaign-card__desc {
			margin: 0;
			white-space: normal;
			overflow-wrap: anywhere;
			word-break: break-word;
		}
	</style>

	<link rel="icon" type="image/svg+xml" href="favicon.svg">
	<link rel="manifest" href="manifest.webmanifest">

	<script type="text/javascript" src="sw-injector.js"></script>
	<script blocking="render" type="module" src="js/styleswitch.js"></script>
	<script type="text/javascript" src="js/navigation.js"></script>
	<script type="module" src="js/browsercheck.js"></script>
</head>

<body>
<div class="overlay-noise no-print"></div>

<header class="ve-mobile-sm__hidden page__header">
	<div class="container ve-flex-v-baseline">
		<h1 class="page__title ve-no-wrap ve-my-0">Grimorio Maulino</h1>
		<p class="page__subtitle ve-no-wrap ve-my-0">Selecciona una campaña</p>
	</div>
</header>

<nav class="container page__nav" id="navigation">
	<ul class="nav nav-pills page__nav-inner" id="navbar"></ul>
</nav>

<main class="container ve-flex-col">
	<div class="ve-flex-v-center ve-my-2">
		<h2 class="ve-my-0">Campañas disponibles</h2>
	</div>
	<div id="grimorio-campaign-grid" class="grimoire-campaign-grid"></div>
</main>

<script type="module" src="js/grimorio-maulino-index.js"></script>
</body>
</html>
